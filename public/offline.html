<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { max-width: 520px; padding: 32px 22px; }
    p { line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금 오프라인입니다</h1>
    <p>이 앱은 자료를 기기에 저장하지 않습니다. 네트워크에 다시 연결한 뒤 로그인하고, 서버가 이 기기를 승인된 기기로 확인해야 자료가 열립니다.</p>
  </main>
</body>
</html>
